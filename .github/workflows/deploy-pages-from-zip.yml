name: Deploy TCG game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tcg-game-v*.zip'
      - 'patches/**'
      - '.github/workflows/deploy-pages-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract latest browser game
        run: |
          rm -rf extracted site
          mkdir -p extracted site
          ZIP="$(ls -1v tcg-game-v*.zip | tail -n 1)"
          echo "Deploying $ZIP"
          unzip -q "$ZIP" -d extracted
          INDEX="$(find extracted -name index.html -type f | head -n 1)"
          test -n "$INDEX"
          ROOT="$(dirname "$INDEX")"
          cp -a "$ROOT"/. site/

      - name: Apply browser patches
        run: |
          cp patches/team-detail-v44.js site/team-detail-v44.js
          cat patches/progression-v45-part*.js > site/progression-v45.js
          cat patches/progression-v46-part*.js > site/progression-v46.js
          cat patches/progression-v47-part*.js > site/progression-v47.js
          cat patches/progression-v48-part*.js > site/progression-v48.js
          cat patches/progression-v49-part*.js > site/progression-v49.js
          node --check site/team-detail-v44.js
          node --check site/progression-v45.js
          node --check site/progression-v46.js
          node --check site/progression-v47.js
          node --check site/progression-v48.js
          node --check site/progression-v49.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          # v49 dungeon cards must exist in CARDS before save-data validation runs.
          if '"dg01"' not in s:
              anchor='["n2god02","GOD","《GOD》雷煌天狐・ライカゼウス","god",2]'
              dungeon_cards=',\n["dg01","R","黄金巨像ミダス","earth",-1],["dg02","R","古代武神ヴァルガ","sword",-1],["dg03","R","結晶獣クリスタロス","holy",-1]'
              if anchor not in s:
                  raise SystemExit("v49 dungeon card injection anchor not found")
              s=s.replace(anchor, anchor+dungeon_cards, 1)
          tags=[
              '<script src="team-detail-v44.js?v=45"></script>',
              '<script src="progression-v45.js?v=45"></script>',
              '<script src="progression-v46.js?v=46"></script>',
              '<script src="progression-v47.js?v=47"></script>',
              '<script src="progression-v48.js?v=48"></script>',
              '<script src="progression-v49.js?v=49"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace("</body>", tag+"\n</body>")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
